name: EAS Update on Push

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.vscode/**'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Canal de EAS al que desplegar (preview / production)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
      message:
        description: 'Mensaje de la actualización (opcional)'
        required: false
        default: ''

jobs:
  update:
    name: Publicar actualizacion en EAS
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout del repositorio
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📦 Configurar Expo y EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📥 Instalar dependencias
        run: npm ci

      - name: 🔍 Verificacion de tipos (TypeScript)
        run: npx tsc --noEmit

      - name: 🚀 Publicar EAS Update
        run: |
          CHANNEL="${{ github.event.inputs.channel || 'preview' }}"
          RAW_MESSAGE="${{ github.event.inputs.message || github.event.head_commit.message || 'Auto update on push' }}"
          # Tomar solo la primera linea del mensaje de commit para evitar saltos de linea
          MESSAGE=$(echo "$RAW_MESSAGE" | head -n 1 | tr -d '"')
          echo "Desplegando en canal: $CHANNEL con mensaje: $MESSAGE"
          eas update --channel "$CHANNEL" --message "$MESSAGE" --non-interactive
